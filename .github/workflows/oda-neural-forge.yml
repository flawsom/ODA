name: ODA Neural Forge

# Free, keyless neural forge: runs a real open-weight LLM (Qwen3 via
# llama.cpp) on GitHub's free runners — no API key, no vendor. The model is
# the absolute best that fits the 7 GB runner (Qwen3-8B Q4_K_M); pick the 4B
# for ~2x speed. Every letter gets the same pipeline as the app: glossary
# training memory, reference-standard pass, per-letter translator rating.
#
# Trigger: manual (workflow_dispatch) or automatically when the letter inbox
# changes. Outputs are committed back to letters/out/neural.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "GGUF model — 8b = best quality, 4b = ~2x faster"
        type: choice
        default: "8b"
        options: ["8b", "4b"]
      limit:
        description: "Letters per matrix batch (max ~12 on a 2-core runner)"
        type: number
        default: 12
  push:
    branches: [main, master]
    paths:
      - "letters/**"
      - "!letters/out/**"

permissions:
  contents: write

concurrency:
  group: oda-neural-forge
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 12, 24, 36, 48, 60]
    env:
      MODEL_SIZE: ${{ inputs.model || '8b' }}
      BATCH_LIMIT: ${{ inputs.limit || 12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies (ODA libs)
        run: bun install

      - name: Install neural runtime (llama.cpp for node)
        working-directory: scripts/neural
        run: npm install

      - name: Resolve model
        id: model
        run: |
          if [ "$MODEL_SIZE" = "4b" ]; then
            echo "name=Qwen3-4B-Q4_K_M" >> "$GITHUB_OUTPUT"
            echo "url=https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
            echo "file=scripts/neural/models/Qwen3-4B-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
          else
            echo "name=Qwen3-8B-Q4_K_M" >> "$GITHUB_OUTPUT"
            echo "url=https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
            echo "file=scripts/neural/models/Qwen3-8B-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache model (shared across matrix jobs)
        uses: actions/cache@v4
        with:
          path: scripts/neural/models
          key: oda-gguf-${{ steps.model.outputs.name }}

      - name: Download model
        run: |
          mkdir -p scripts/neural/models
          if [ ! -s "$MODEL_FILE" ]; then
            curl -L --retry 3 --retry-delay 5 -o "$MODEL_FILE" "$MODEL_URL"
          fi
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
          MODEL_URL: ${{ steps.model.outputs.url }}

      - name: Forge letters (neural)
        run: bun scripts/neural/forge-neural.ts \
          --dir "letters/8-ALL NEW LETTER" \
          --out "letters/out/neural/part-${{ matrix.offset }}" \
          --model "$MODEL_FILE" \
          --model-name "${{ steps.model.outputs.name }}" \
          --offset ${{ matrix.offset }} \
          --limit "$BATCH_LIMIT"
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
          BATCH_LIMIT: ${{ inputs.limit || 12 }}

      - name: Upload batch
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.offset }}
          path: letters/out/neural/part-${{ matrix.offset }}
          if-no-files-found: ignore
          retention-days: 1

  commit:
    needs: forge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect batches
        uses: actions/download-artifact@v4
        with:
          pattern: forge-*
          merge-multiple: true
          path: letters/out/neural

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Merge reports
        run: bun scripts/neural/merge-report.ts --dir letters/out/neural

      - name: Commit neural outputs
        run: |
          git config user.name "ODA Neural Forge"
          git config user.email "actions@users.noreply.github.com"
          git add letters/out/neural
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "forge(neural): batch letter forge — keyless Qwen3 on free GitHub Actions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
